<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat File Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell mobile-files-open">
      <aside class="sidebar" aria-label="フォルダ一覧">
        <div class="sidebar-header">
          <div class="brand-block">
            <span class="brand-name">チャット</span>
          </div>
          <div class="header-tools">
            <button class="header-button" type="button" aria-label="検索">⌕</button>
            <button class="header-button" id="addChatButton" type="button" aria-label="チャットを追加">#</button>
            <button class="header-button add-button" id="addFolderButton" type="button" aria-label="フォルダを追加">＋</button>
          </div>
        </div>

        <nav class="folder-list" id="folderList" aria-label="フォルダ一覧"></nav>
      </aside>

      <main class="content" aria-live="polite">
        <header class="channel-header" aria-label="チャンネルヘッダー">
          <button class="channel-back" type="button" aria-label="戻る">‹</button>
          <div class="channel-meta">
            <span class="channel-name">雑談</span>
            <small>11人</small>
          </div>
          <button class="channel-action" type="button" aria-label="ファイル一覧を表示">☰</button>
        </header>

        <div class="message-list" aria-label="メッセージ一覧"></div>

        <div class="composer" aria-label="メッセージ入力欄"></div>

        <div class="empty-state" aria-hidden="true">
          <div class="empty-icon">
            <span class="bubble bubble-left"></span>
            <span class="bubble bubble-right"></span>
            <span class="bubble-tail tail-left"></span>
            <span class="bubble-tail tail-right"></span>
          </div>
          <p></p>
        </div>
      </main>
    </div>

    <div class="modal" id="renameModal" aria-hidden="true">
      <div class="modal-panel">
        <h3>フォルダ名の変更</h3>
        <label class="sr-only" for="renameInput">新しいフォルダ名</label>
        <input id="renameInput" type="text" maxlength="32" placeholder="新しいフォルダ名" />
        <div class="modal-actions">
          <button type="button" id="cancelRename" class="secondary-button">キャンセル</button>
          <button type="button" id="saveRename" class="primary-button">保存</button>
        </div>
      </div>
    </div>

    <div class="modal" id="deleteModal" aria-hidden="true">
      <div class="modal-panel">
        <h3>フォルダを削除</h3>
        <p>本当に <strong id="deleteFolderName">このフォルダ</strong> を削除しますか？</p>
        <div class="modal-actions">
          <button type="button" id="cancelDelete" class="secondary-button">キャンセル</button>
          <button type="button" id="confirmDelete" class="danger-button">削除</button>
        </div>
      </div>
    </div>

    <div class="modal" id="chatModal" aria-hidden="true">
      <div class="modal-panel">
        <h3>新しいチャットを追加</h3>
        <p>保存先: <strong id="chatTargetFolderName">このフォルダ</strong></p>
        <label class="sr-only" for="chatNameInput">新しいチャット名</label>
        <input id="chatNameInput" type="text" maxlength="32" placeholder="チャット名を入力" />
        <div class="modal-actions">
          <button type="button" id="cancelChat" class="secondary-button">キャンセル</button>
          <button type="button" id="saveChat" class="primary-button">保存</button>
        </div>
      </div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
